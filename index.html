<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Weather Dashboard</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #38ef7d;
      --accent-cyan: #11998e;
      --accent-glow: rgba(56, 239, 125, 0.15);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .widget-screen {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(145deg, #121824, #0b0f19);
      border-radius: 32px;
      padding: 28px;
      border: 1px solid var(--card-border);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .location {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .time-container {
      text-align: right;
    }

    .clock {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .date {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-weather {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .temp-box {
      display: flex;
      align-items: flex-start;
    }

    .temp {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    .unit {
      font-size: 1.5rem;
      font-weight: 500;
      margin-top: 6px;
      color: var(--text-sub);
    }

    .condition-box {
      text-align: right;
    }

    .weather-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 4px;
      filter: drop-shadow(0 0 12px rgba(56, 239, 125, 0.3));
    }

    .condition {
      font-size: 0.95rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* Rain Alert Card */
    .rain-card {
      background: var(--accent-glow);
      border: 1px solid rgba(56, 239, 125, 0.3);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .rain-icon {
      background: rgba(56, 239, 125, 0.2);
      padding: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rain-info {
      display: flex;
      flex-direction: column;
    }

    .rain-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38ef7d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rain-time {
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Forecast Section */
    .forecast-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .forecast-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .forecast-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 16px;
    }

    .day {
      font-weight: 600;
      font-size: 0.9rem;
      width: 60px;
    }

    .forecast-condition {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .forecast-icon {
      width: 24px;
      height: 24px;
    }

    .rain-chance {
      color: #38ef7d;
      font-size: 0.75rem;
      font-weight: 600;
      width: 40px;
    }

    .temps {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .temps .min {
      color: var(--text-sub);
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="widget-screen">
    <!-- Header: Location & Live Time -->
    <div class="header">
      <div>
        <div class="location">San Francisco</div>
        <div class="date" id="date">Thu, Oct 24</div>
      </div>
      <div class="time-container">
        <div class="clock" id="clock">09:41</div>
      </div>
    </div>

    <!-- Main Temperature -->
    <div class="hero-weather">
      <div class="temp-box">
        <span class="temp">68</span>
        <span class="unit">°F</span>
      </div>
      <div class="condition-box">
        <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#38ef7d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>
          <path d="M8 16l-2 3"></path>
          <path d="M12 16l-2 3"></path>
          <path d="M16 16l-2 3"></path>
        </svg>
        <div class="condition">Light Rain</div>
      </div>
    </div>

    <!-- Rain Alert/Timing -->
    <div class="rain-card">
      <div class="rain-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38ef7d" stroke-width="2">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
      </div>
      <div class="rain-info">
        <span class="rain-title">Precipitation Tracker</span>
        <span class="rain-time">Rain starting in <strong>25 mins</strong> (10:10 AM)</span>
      </div>
    </div>

    <!-- 3-Day Forecast -->
    <div class="forecast-title">3-Day Forecast</div>
    <div class="forecast-list">
      
      <div class="forecast-item">
        <span class="day">Today</span>
        <div class="forecast-condition">
          <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="#38ef7d" stroke-width="2">
            <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>
            <path d="M12 16l-2 3"></path>
          </svg>
          <span class="rain-chance">80%</span>
        </div>
        <div class="temps">68° <span class="min">54°</span></div>
      </div>

      <div class="forecast-item">
        <span class="day">Fri</span>
        <div class="forecast-condition">
          <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <span class="rain-chance" style="color: transparent;">0%</span>
        </div>
        <div class="temps">72° <span class="min">56°</span></div>
      </div>

      <div class="forecast-item">
        <span class="day">Sat</span>
        <div class="forecast-condition">
          <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
            <path d="M17.5 19.12A4.5 4.5 0 0 0 16 10.5a7 7 0 1 0-13.78 2.08 4.5 4.5 0 1 0 2.28 8.54h13"></path>
          </svg>
          <span class="rain-chance" style="color: #94a3b8;">10%</span>
        </div>
        <div class="temps">65° <span class="min">51°</span></div>
      </div>

    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
